<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sales Report Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Daily Sales Visit Report Generator</h1>
            <p class="subtitle">Hotel Sales & Marketing Team</p>
        </header>

        <!-- Entry Form -->
        <section class="form-section">
            <h2>Add Entry</h2>
            <form id="reportForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="entryDate">Date</label>
                        <input type="date" id="entryDate" required>
                    </div>
                    <div class="form-group">
                        <label for="companyName">Company Name</label>
                        <input type="text" id="companyName" placeholder="e.g. Rayna, Giyas" required>
                    </div>
                    <div class="form-group">
                        <label for="personName">Person Name</label>
                        <input type="text" id="personName" placeholder="e.g. Vimal, Aisha" required>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label for="remarks">Remarks</label>
                    <textarea id="remarks" rows="3" placeholder="Discussed with sales person, rates offered, inquiries received..." required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-add">➕ Add Entry</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>
            </form>
        </section>

        <!-- Entries List (Quick view) -->
        <section class="entries-section">
            <div class="entries-header">
                <h2>Entries (<span id="entryCount">0</span>)</h2>
                <div class="entries-actions">
                    <button id="clearAll" class="btn btn-danger btn-small">🗑️ Clear All</button>
                </div>
            </div>
            <div id="entriesList" class="entries-list">
                <p class="no-data">No entries yet. Add entries above to generate a report.</p>
            </div>
        </section>

        <!-- Generate Report Section -->
        <section class="generate-section">
            <h2>Generate Report</h2>
            <div class="generate-options">
                <div class="form-group">
                    <label for="reportTitle">Report Title (optional)</label>
                    <input type="text" id="reportTitle" placeholder="Daily Sales Visit Report" value="Daily Sales Visit Report">
                </div>
                <div class="generate-buttons">
                    <button id="generateReport" class="btn btn-primary btn-large">📄 Generate Report</button>
                    <button id="exportExcel" class="btn btn-success btn-large">📥 Export to Excel</button>
                    <button id="printReport" class="btn btn-print btn-large">🖨️ Print Report</button>
                </div>
            </div>
        </section>

        <!-- Generated Report Preview -->
        <section id="reportPreview" class="report-preview" style="display:none;">
            <div class="preview-header">
                <h2>Report Preview</h2>
                <button id="closePreview" class="btn btn-secondary btn-small">✕ Close</button>
            </div>
            <div id="reportOutput" class="report-output">
                <!-- Generated report will appear here -->
            </div>
        </section>
    </div>

    <!-- Print-only report -->
    <div id="printArea" class="print-area">
        <!-- Content for printing -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
