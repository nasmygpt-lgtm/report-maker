<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sales Report Generator</title>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Daily Sales Report Generator</h1>
            <p class="subtitle">Hotel Sales & Marketing Team</p>
        </header>

        <!-- Entry Form -->
        <section class="form-section">
            <h2>New Report Entry</h2>
            <form id="reportForm">
                <div class="form-row three-col">
                    <div class="form-group">
                        <label for="entryDate">Date</label>
                        <input type="date" id="entryDate" required>
                    </div>
                    <div class="form-group">
                        <label for="companyName">Company Name</label>
                        <input type="text" id="companyName" placeholder="e.g. Rayna, Giyas" required>
                    </div>
                    <div class="form-group">
                        <label for="personName">Person Name</label>
                        <input type="text" id="personName" placeholder="e.g. Vimal, Aisha" required>
                    </div>
                </div>

                <div class="form-row two-col">
                    <div class="form-group">
                        <label for="personRole">Person Role</label>
                        <select id="personRole">
                            <option value="sales">Sales Person</option>
                            <option value="contracting">Contracting Manager</option>
                            <option value="operation">Operation Incharge</option>
                            <option value="team">The Team</option>
                            <option value="company">Company Person</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="discussionType">Discussion Type</label>
                        <select id="discussionType">
                            <option value="inquiry">Have Inquiry / Rates Given</option>
                            <option value="followup">Follow Up / Waiting Update</option>
                            <option value="confirmed">Booking Confirmed</option>
                            <option value="new_agency">New Agency Approached</option>
                            <option value="rates_discussion">Rates & Season Discussion</option>
                            <option value="group_inquiry">Group Inquiry</option>
                            <option value="fit_inquiry">FIT Inquiry</option>
                            <option value="parity_issue">Rate Parity / Portal Issue</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="keyPoints">Key Points <span class="hint">(Enter your bullet points - the report will be generated automatically)</span></label>
                    <textarea id="keyPoints" rows="4" placeholder="Example:
- inquiry for Oct 12-18
- 10 rooms with breakfast
- offered AED 250+15
- requested to confirm group"></textarea>
                </div>

                <!-- Optional fields that appear based on discussion type -->
                <div id="optionalFields" class="optional-fields">
                    <div class="form-row three-col">
                        <div class="form-group">
                            <label for="travelDates">Travel Dates (optional)</label>
                            <input type="text" id="travelDates" placeholder="e.g. Oct 12-18, 2026">
                        </div>
                        <div class="form-group">
                            <label for="rooms">Rooms / Pax (optional)</label>
                            <input type="text" id="rooms" placeholder="e.g. 10 rooms, 30 pax">
                        </div>
                        <div class="form-group">
                            <label for="rateOffered">Rate Offered (optional)</label>
                            <input type="text" id="rateOffered" placeholder="e.g. AED 250+15">
                        </div>
                    </div>
                    <div class="form-row two-col">
                        <div class="form-group">
                            <label for="roomType">Room Type (optional)</label>
                            <input type="text" id="roomType" placeholder="e.g. Double, Triple, DBL+TRPL">
                        </div>
                        <div class="form-group">
                            <label for="mealPlan">Meal Plan (optional)</label>
                            <select id="mealPlan">
                                <option value="">-- Select --</option>
                                <option value="RO">Room Only (RO)</option>
                                <option value="BB">Bed & Breakfast (BB)</option>
                                <option value="HB">Half Board (HB)</option>
                                <option value="FB">Full Board (FB)</option>
                                <option value="TD">Tour Desk (TD)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row two-col">
                        <div class="form-group">
                            <label for="supplement">Supplement (optional)</label>
                            <input type="text" id="supplement" placeholder="e.g. Diwali AED 50, NYE AED 250">
                        </div>
                        <div class="form-group">
                            <label for="duration">Duration (optional)</label>
                            <input type="text" id="duration" placeholder="e.g. 3 nights, 6N/7D">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-large">📄 Generate & Add Entry</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>
            </form>
        </section>

        <!-- Generated Report -->
        <section class="report-section">
            <div class="report-header">
                <h2>Generated Report</h2>
                <div class="report-actions">
                    <button id="exportExcel" class="btn btn-success">📥 Export Excel</button>
                    <button id="printReport" class="btn btn-print">🖨️ Print</button>
                    <button id="clearAll" class="btn btn-danger btn-small">🗑️ Clear All</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="reportTable" class="report-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Company Name</th>
                            <th>Person Name</th>
                            <th>Remarks</th>
                        </tr>
                    </thead>
                    <tbody id="reportBody">
                    </tbody>
                </table>
                <p id="noData" class="no-data">No entries yet. Fill the form above and click "Generate & Add Entry".</p>
            </div>
        </section>
    </div>

    <!-- Print Area -->
    <div id="printArea" class="print-area"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
