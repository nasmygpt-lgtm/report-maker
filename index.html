<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sales Report Generator</title>
    <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Daily Sales Report Generator</h1>
        </header>

        <!-- Single Entry -->
        <section class="input-section">
            <h3>Single Entry</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="entryDate">
                </div>
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="companyName" placeholder="Company name">
                </div>
                <div class="form-group">
                    <label>Person Name</label>
                    <input type="text" id="personName" placeholder="Person name">
                </div>
                <div class="form-group btn-group">
                    <button id="generateBtn" class="btn-generate">Generate Report</button>
                </div>
            </div>
        </section>

        <!-- Bulk Entry -->
        <section class="input-section bulk-section">
            <h3>Bulk Generate</h3>
            <p class="bulk-hint">Enter multiple companies — one per line: <strong>Company Name, Person Name</strong></p>
            <div class="bulk-row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="bulkDate">
                </div>
                <div class="form-group bulk-textarea-group">
                    <textarea id="bulkInput" rows="5" placeholder="Rayna, Vimal
Giyas, Ticket
Pace Tourism, Aisha
Dhar Tours, Thejas
UHM vacation, Samira"></textarea>
                </div>
                <div class="form-group btn-group">
                    <button id="bulkGenerateBtn" class="btn-generate btn-bulk">Generate All</button>
                </div>
            </div>
        </section>

        <!-- Generated Report Table -->
        <section class="report-section">
            <div class="report-header">
                <div class="report-actions">
                    <button id="exportExcel" class="btn-export">📥 Export Excel</button>
                    <button id="printReport" class="btn-print">🖨️ Print</button>
                    <button id="clearAll" class="btn-clear">🗑️ Clear</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="reportTable" class="report-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Company Name</th>
                            <th>Person Name</th>
                            <th>Remarks</th>
                        </tr>
                    </thead>
                    <tbody id="reportBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Print Area -->
    <div id="printArea" class="print-area"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="app.js?v=7"></script>
</body>
</html>
